<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191c" />
      <stop offset="100%" stop-color="#0c0d0f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38393e" stroke-width="2" />
  
  <!-- Subtle Horizon line across center -->
  <line x1="8" y1="36" x2="56" y2="36" stroke="url(#horizonGlow)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Stylized BH Monogram -->
  <!-- 'B' letterform -->
  <path d="M 17 19 L 27 19 C 31 19 33 21 33 24 C 33 26.5 31.5 28 29 28.5 C 32.5 29.2 34 31 34 34.5 C 34 38 31 40 27 40 L 17 40 Z M 22 23 L 22 28 L 26.5 28 C 28 28 29 27.2 29 25.5 C 29 23.8 28 23 26.5 23 Z M 22 31.5 L 22 36.5 L 27 36.5 C 28.8 36.5 29.8 35.6 29.8 34 C 29.8 32.4 28.8 31.5 27 31.5 Z" fill="url(#goldGrad)" />
  
  <!-- 'H' letterform -->
  <path d="M 37 19 L 41.5 19 L 41.5 27.5 L 47.5 27.5 L 47.5 19 L 52 19 L 52 40 L 47.5 40 L 47.5 31.5 L 41.5 31.5 L 41.5 40 L 37 40 Z" fill="url(#goldGrad)" opacity="0.9" />
  
  <!-- Sun/Star Crest at Horizon -->
  <circle cx="34" cy="36" r="2" fill="#fffbeb" />
</svg>